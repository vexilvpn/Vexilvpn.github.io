    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.ready(); }

        let plan = { days: 30, price: 99 };
        let discountMultiplier = 1.0;

        function generateAllServersBundle(userId) {
            const token = 'sec_' + userId + '_' + Array.from(crypto.getRandomValues(new Uint8Array(8))).map(b=>b.toString(16).padStart(2,'0')).join('') + '_dev1';
            const flow = 'xtls-rprx-vision';
            const sid = '4a8f9c2d1e0b5a3f';
            const pub = 'Z8uP5sAtH2qX9K3LpW7vY01mQeRtYuIoPaSdFgHjKlZxcvbnm1234567890';

            const servers = [
                `vless://${token}@206.251.50.82:443?security=reality&encryption=none&pbk=${pub}&headerType=none&type=tcp&sni=dl.google.com&sid=${sid}&flow=${flow}#Германия`,
                `vless://${token}@185.100.84.12:443?security=reality&encryption=none&pbk=${pub}&headerType=none&type=tcp&sni=dl.google.com&sid=${sid}&flow=${flow}#Нидерланды`,
                `vless://${token}@194.87.68.20:443?security=reality&encryption=none&pbk=${pub}&headerType=none&type=tcp&sni=dl.google.com&sid=${sid}&flow=${flow}#Россия`
            ];

            return servers.join('\n');
        }

        function refreshState() {
            const params = new URLSearchParams(window.location.search);
            const urlExp = params.get('sub_end');
            const urlKey = params.get('key');
            const urlUid = params.get('uid');

            // Очистка старых фейковых дат больше года
            const savedExp = parseInt(localStorage.getItem('vexil_vpn_exp') || '0');
            if (savedExp > Date.now() + (366 * 86400000)) {
                localStorage.removeItem('vexil_vpn_exp');
            }

            // Если бот передал реальную дату из базы — сохраняем её
            if (urlExp !== null && urlExp !== '0') {
                localStorage.setItem('vexil_vpn_exp', urlExp);
            }
            if (urlKey) {
                localStorage.setItem('vexil_vpn_key', decodeURIComponent(urlKey));
            }

            const exp = localStorage.getItem('vexil_vpn_exp');
            const uid = urlUid || tg?.initDataUnsafe?.user?.id || '5012818326';
            const uname = tg?.initDataUnsafe?.user?.first_name || 'Пользователь';
            
            document.getElementById('user-display-name').innerText = `${uname} (ID: ${uid})`;

            const badge = document.getElementById('badge-sub-status');
            const badgeLabel = document.getElementById('badge-sub-label');
            const title = document.getElementById('home-status-title');
            const desc = document.getElementById('home-status-desc');
            const vlessString = document.getElementById('vless-string');

            if (exp && parseInt(exp) > Date.now()) {
                const date = new Date(parseInt(exp));
                const diffDays = Math.max(1, Math.ceil((parseInt(exp) - Date.now()) / 86400000));
                badge.className = 'status-badge active';
                badgeLabel.innerText = `АКТИВЕН • ${diffDays} ДН.`;
                title.innerText = 'Защита включена';
                desc.innerText = `Подписка действительна до ${date.toLocaleDateString('ru-RU')}. Включено 3 локации (1 устройство).`;
                
                const savedKey = localStorage.getItem('vexil_vpn_key');
                vlessString.innerText = savedKey ? savedKey : generateAllServersBundle(uid);
            } else {
                badge.className = 'status-badge inactive';
                badgeLabel.innerText = 'НЕТ ПОДПИСКИ';
                title.innerText = 'Защита отключена';
                desc.innerText = 'Оформите подписку для безлимитного доступа на максимальной скорости.';
                vlessString.innerText = 'Ключ недоступен. Требуется активная подписка.';
            }
        }

        function nav(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`screen-${screenId}`).classList.add('active');
            const order = { 'home': 0, 'tariffs': 1, 'setup': 2 };
            document.querySelectorAll('.dock-item').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === order[screenId]);
            });
            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        function pickPlan(el, days, price) {
            document.querySelectorAll('.plan-box').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            const finalPrice = Math.round(price * discountMultiplier);
            plan = { days, price: finalPrice };
            document.getElementById('checkout-btn').innerText = `Перейти к оплате ${finalPrice} ₽`;
            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        function applyPromoInput() {
            const input = document.getElementById('promo-input-field');
            const code = input.value.trim().toUpperCase();
            if (!code) return;

            alert('Для активации промокода перейдите в меню бота и нажмите кнопку «🎟 Ввести промокод»');
        }

        function redirectToPayment() {
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
            alert('Оплата временно недоступна. Ведутся технические работы по подключению платёжного шлюза.');
        }

        function copyKey() {
            const exp = localStorage.getItem('vexil_vpn_exp');
            if (!exp || parseInt(exp) <= Date.now()) {
                if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                alert('У вас нет активной подписки! Оформите подписку или активируйте промокод.');
                return;
            }

            const bundle = document.getElementById('vless-string').innerText.trim();
            navigator.clipboard.writeText(bundle).then(() => {
                if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                alert('Список серверов скопирован!\nВставьте его в Happ или v2rayNG через «Импорт из буфера».');
            });
        }

        function copyRef() {
            const uid = tg?.initDataUnsafe?.user?.id || '5012818326';
            const link = `https://t.me/vexilvpn_bot?start=ref_${uid}`;
            navigator.clipboard.writeText(link).then(() => {
                if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                alert('Реферальная ссылка скопирована!');
            });
        }

        refreshState();
    </script>
